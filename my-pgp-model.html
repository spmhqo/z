<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Prompt Generator</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca; /* Custom elegant dark-indigo header font color */
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        /* Header Styles */
        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color); /* Updated header font color variable */
            margin-bottom: 8px;
        }

        .doc-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Section Layout */
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 36px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .doc-input {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--text-main);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .doc-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(112, 107, 99, 0.1);
        }

        /* Output Box Styling */
        .output-card {
            margin-top: 30px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .prompt-preview {
            width: 100%;
            min-height: 180px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
            resize: vertical;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        .copy-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        /* Footer */
        .doc-footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            body {
                padding: 12px 8px;
            }
            .document-container {
                padding: 24px 16px;
            }
            .doc-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="document-container">
        
        <!-- Header -->
        <header class="doc-header">
            <h1 class="doc-title">Prompt Workspace</h1>
            <p class="doc-subtitle">Fill in your custom variables to dynamically generate structured prompts.</p>
        </header>

        <!-- User Inputs Section -->
        <section>
            <h2 class="section-heading">1. Variables & Inputs</h2>
            
            <div class="input-group">
                <label class="input-label" for="inputTopic">Target Subject / Topic:</label>
                <textarea id="inputTopic" class="doc-input" placeholder="e.g., Quantum Computing Fundamentals" oninput="updatePrompt()">Introduction to Machine Learning</textarea>
            </div>

            <div class="input-group">
                <label class="input-label" for="inputGoal">Specific Objective / Goal:</label>
                <textarea id="inputGoal" class="doc-input" placeholder="e.g., Explain to a beginner using simple analogies" oninput="updatePrompt()">Break down core concepts using the ELI5 methodology for high school students.</textarea>
            </div>
        </section>

        <!-- Generated Output Section -->
        <section>
            <h2 class="section-heading">2. Generated Output Prompt</h2>
            
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">Live Prompt Preview</span>
                </div>
                <textarea id="promptOutput" class="prompt-preview" readonly></textarea>
                <button class="copy-btn" onclick="copyPrompt()">Copy to Clipboard</button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>

    </div>

    <script>
        // Reusable Prompt Template containing placeholders
        const template = `Act as an expert instructional designer and curriculum specialist. 

I need you to help me structure comprehensive learning material based on the following parameters:

1. CORE SUBJECT:
{TOPIC}

2. OBJECTIVE & METHODOLOGY:
{GOAL}

Please provide a detailed, step-by-step framework, keeping the explanations concise, engaging, and structured logically.`;

        // Function to update the prompt in real-time as the user types
        function updatePrompt() {
            const topic = document.getElementById('inputTopic').value;
            const goal = document.getElementById('inputGoal').value;

            let finalPrompt = template
                .replace('{TOPIC}', topic)
                .replace('{GOAL}', goal);

            document.getElementById('promptOutput').value = finalPrompt;
        }

        // Copy functionality with visual feedback
        function copyPrompt() {
            const outputBox = document.getElementById('promptOutput');
            const btn = document.querySelector('.copy-btn');

            outputBox.select();
            outputBox.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');

                window.getSelection().removeAllRanges();

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        }

        // Initialize prompt generation on page load
        window.onload = updatePrompt;
    </script>
</body>
</html>
