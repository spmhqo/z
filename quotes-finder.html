<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes Finder</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        /* Header Styles */
        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }

        .doc-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Section Layout */
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 36px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* Output Box Styling */
        .output-card {
            margin-top: 30px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .prompt-preview {
            width: 100%;
            min-height: 420px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
            resize: vertical;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        .copy-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        /* Footer */
        .doc-footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            body {
                padding: 12px 8px;
            }
            .document-container {
                padding: 24px 16px;
            }
            .doc-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="document-container">
        
        <!-- Header -->
        <header class="doc-header">
            <h1 class="doc-title">Quotes Finder</h1>
            <p class="doc-subtitle">(from a content.)</p>
        </header>

        <!-- Prompt Section -->
        <section>
            <h2 class="section-heading">Prompt Box</h2>
            
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">Prompt</span>
                </div>
                <textarea id="promptBox" class="prompt-preview" readonly>Answer the following prompt in Bengali (India).

Rules:
- Use only Bengali (India).
- Always address the reader as "আপনি".
- Never use "তুমি" or "তুই".
- Use a natural Kolkata-style conversational tone.
- Use natural, modern Bengali (India).
- Avoid Bangladeshi vocabulary, spelling, and expressions.

PROMPT

Read, understand, and review the content of the uploaded document.

TASK

Identify relevant, authentic, and verifiable quotes from world-renowned personalities, recognized subject-matter experts, respected practitioners, authors, researchers, business leaders, or other credible authorities that relate meaningfully to the topics, concepts, methods, principles, problems, or activities discussed in the document.

The objective is to discover authoritative quotes that can be used as standalone social media posts to add perspective, context, credibility, or inspiration around the subject discussed in the document.

Do not limit the search to the main topic. A relevant quote may relate to a specific concept, activity, problem, principle, or method discussed anywhere in the document.

FOR EACH QUOTE, PROVIDE:

Quote: The exact quote

Speaker: The person who said or wrote it

Relevance: Why the quote is relevant to the document's content

Related topic/activity: The specific topic, activity, problem, method, or principle it relates to

Social media angle: The idea or discussion the quote could introduce or support

Source: The original or most authoritative available source for the quote

Verification status: Verified / Strongly attributed but not independently verified / Unverified

QUOTE ACCURACY RULES

Do not invent, reconstruct, paraphrase, or "improve" quotations and present them as exact quotes.

Do not attribute a quote to a famous person merely because it is commonly found online under that person's name.

Prefer primary sources whenever available, such as books, speeches, interviews, articles, official publications, recorded talks, or original writings.

If the original source cannot be reliably established, clearly state that limitation.

Do not use a quote simply because the speaker is famous. The quote must have genuine relevance to the content.

Prefer quotes that provide a meaningful insight rather than generic motivational statements.

Preserve the original meaning and wording of the quote.

Respect applicable quotation and copyright limits when presenting quotes.

Where a quote is commonly misattributed or its authenticity is uncertain, do not present it as verified.

If no sufficiently relevant and reliably sourced quote can be found, say so rather than filling the list with weak or questionable quotations.

QUALITY STANDARD

Prioritize quotes that:

1. Directly illuminate an important idea in the content
​2. Provide a useful perspective on a relevant activity or problem
3. Come from a genuinely authoritative source
4. Can stand alone as a social media post
5. Add intellectual or practical value rather than merely decoration

OUTPUT

Present the strongest and most relevant quotes first.

For each quote, clearly separate the exact quotation from your explanation and source information.</textarea>
                <button class="copy-btn" onclick="copyPrompt()">Copy Prompt</button>
            </div>
        </section>

        <!-- Footer -->
        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>

    </div>

    <script>
        // Copy functionality with visual feedback
        function copyPrompt() {
            const outputBox = document.getElementById('promptBox');
            const btn = document.querySelector('.copy-btn');

            outputBox.select();
            outputBox.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');

                window.getSelection().removeAllRanges();

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        }
    </script>
</body>
</html>
